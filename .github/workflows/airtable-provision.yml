# Outreach schema  ->  Airtable
# =============================
#
# Repo hi source of truth hai (airtable/provision_outreach_base.py).
# Ye workflow us schema ko live Airtable base par apply karta hai.
#
# EK BAAR KA SETUP  (bina iske kuch nahi chalega)
#   1. Airtable -> Developer hub -> Personal access tokens -> naya token
#      Scopes : schema.bases:write, schema.bases:read
#      Access : wahi base jise chhuna hai
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions
#      -> New repository secret -> naam: AIRTABLE_TOKEN
#
#   ⚠  Ye GITHUB SECRET hona chahiye. Tumhare laptop ka env var, ya Claude
#      Code environment ka env var, GitHub Actions ko DIKHTA HI NAHI.
#      Runner ek alag machine hai -- wo sirf secrets/vars padh sakta hai.
#
#   Base ID badalna ho to: same page -> Variables tab -> AIRTABLE_BASE_ID
#   (na ho to neeche wala default use hota hai)
#
# KAB CHALTA HAI
#   push       -> schema file badli, to base apne aap update ho jaata hai
#   manual     -> Actions tab -> Run workflow -> verify / dry-run / provision
#   nightly    -> roz verify, drift dikhane ke liye (kuch likhta nahi)

name: "Airtable: provision base"

on:
  # Schema badla -> base update. Yahi "action se update ho jaaye" wala hissa.
  push:
    branches: [main]
    paths:
      - "airtable/provision_outreach_base.py"
      - ".github/workflows/airtable-provision.yml"

  workflow_dispatch:
    inputs:
      base_id:
        description: "Base ID (khaali chhodo to AIRTABLE_BASE_ID variable / default)"
        required: false
        default: ""
      mode:
        description: "Kya karna hai"
        required: true
        type: choice
        default: verify
        options:
          - verify        # kuch likhta nahi -- live base vs repo schema
          - dry-run       # kuch likhta nahi -- kya banega wo dikhata hai
          - provision     # LIKHTA HAI -- tables + fields + links banata hai

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# Do run ek saath same base ko na chhuein.
concurrency:
  group: airtable-provision
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hamesha chalta hai. Schema graph tuta ho to Airtable ko chhune se
      # pehle hi ruk jao.
      - name: Self-test (0 network)
        run: python3 airtable/provision_outreach_base.py --self-test

      # Event ke hisaab se mode tay karo, aur dekho token hai ya nahi.
      - name: Resolve config
        id: cfg
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) MODE="${{ inputs.mode }}" ;;
            push)              MODE="provision" ;;   # schema badla -> sync
            schedule)          MODE="verify"    ;;
            *)                 MODE="verify"    ;;
          esac

          BASE="${{ inputs.base_id }}"
          [ -z "$BASE" ] && BASE="${{ vars.AIRTABLE_BASE_ID }}"
          [ -z "$BASE" ] && BASE="appXomnU6fddl1b1H"

          if [ -n "$AIRTABLE_TOKEN" ]; then HAS_TOKEN=yes; else HAS_TOKEN=no; fi

          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "base=$BASE"           >> "$GITHUB_OUTPUT"
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "event      : ${{ github.event_name }}"
          echo "mode       : $MODE"
          echo "base       : $BASE"
          echo "token found: $HAS_TOKEN"

      # Token na ho: manual run FAIL kare (tumne jaan-bujh ke chalaya hai),
      # par push/schedule sirf warn karke nikal jaaye -- warna har push red.
      - name: Token missing
        if: steps.cfg.outputs.has_token == 'no' && steps.cfg.outputs.mode != 'dry-run'
        run: |
          echo "::warning::AIRTABLE_TOKEN secret set nahi hai -- Airtable ko chhua nahi gaya."
          {
            echo '## ⚠️ AIRTABLE_TOKEN secret missing'
            echo
            echo 'Airtable ko chhua nahi gaya. Set karne ke liye:'
            echo
            echo '1. Airtable → Developer hub → Personal access tokens'
            echo '   Scopes: `schema.bases:write`, `schema.bases:read`'
            echo '2. Repo → Settings → Secrets and variables → Actions'
            echo '   → New repository secret → naam `AIRTABLE_TOKEN`'
            echo
            echo 'Laptop ka env var yahan kaam nahi karega — runner alag'
            echo 'machine hai, wo sirf GitHub Secrets padh sakta hai.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Manual run tha aur token nahi mila."
            exit 1
          fi

      - name: Dry run
        if: steps.cfg.outputs.mode == 'dry-run'
        run: python3 airtable/provision_outreach_base.py --dry-run

      # Sirf yahi step base me likhta hai. --yes isliye ki runner me tty
      # nahi hota; asli confirmation push/Run-workflow dabana hi hai.
      - name: Provision (writes to Airtable)
        if: steps.cfg.outputs.mode == 'provision' && steps.cfg.outputs.has_token == 'yes'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 airtable/provision_outreach_base.py \
            --base-id "${{ steps.cfg.outputs.base }}" --yes

      # Provision ke baad bhi verify -- "script ne bola ban gaya" par nahi,
      # live base kya keh raha hai us par bharosa karo.
      - name: Verify against live base
        if: >-
          (steps.cfg.outputs.mode == 'verify' || steps.cfg.outputs.mode == 'provision')
          && steps.cfg.outputs.has_token == 'yes'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python3 airtable/provision_outreach_base.py \
            --verify --base-id "${{ steps.cfg.outputs.base }}"

      # Formula/rollup/view/automation API se ban hi nahi sakte. Unke steps
      # job summary me daal do -- GitHub me hi padh lena.
      - name: UI steps -> job summary
        if: always() && steps.cfg.outputs.mode != 'dry-run'
        run: |
          {
            echo '## Airtable me haath se banane wali cheezein'
            echo
            echo 'Airtable ka API formula / rollup / count / lookup fields'
            echo 'create nahi karta, aur views + automations ka endpoint hi'
            echo 'nahi hai. Neeche ke steps UI me karne padenge.'
            echo
            echo '```'
            python3 airtable/provision_outreach_base.py --manual
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
